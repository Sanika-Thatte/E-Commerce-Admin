<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
<title>Admin Dashboard</title>

<link rel="stylesheet" th:href="@{/css/common.css}">

</head>

<body>

    <p class="message" style="color:red;" th:if="${error}" th:text="${error}"></p>
    <p class="message" style="color:green;" th:if="${message}" th:text="${message}"></p>

<div class="dashboard">

<!-- Sidebar -->
<div class="sidebar">
    <h2>Admin Panel</h2>
    <a th:href="@{/adminDashboard}" class="active">Home</a>
    <!-- Show Logout if logged in -->
	<a href="#" sec:authorize="isAuthenticated()" onclick="confirmLogout()">Logout</a>
		
	<!-- Show Login if NOT logged in -->
	<a th:href="@{/adminLogin}" sec:authorize="isAnonymous()">Login</a>
</div>

<!-- Main -->
<div class="main">

    <!-- Top -->
    <div id="topSection"></div>

    <!-- Header -->
    <div class="header">
        <h2>Welcome Admin</h2>
        <!-- Logout Button -->
		    <div class="logout-btn" 
		         sec:authorize="isAuthenticated()" 
		         onclick="confirmLogout()">
		        Logout
		    </div>
		
		    <!-- Login Button -->
		    <div class="logout-btn" 
		         sec:authorize="isAnonymous()"
		         onclick="window.location.href='/adminLogin'">
		        Login
		    </div>
        
    </div>

    

    <!-- Search -->
    <div id="searchSection" class="search-container">

        <div class="search-box">
            <h3>Search Products</h3>
            <form th:action="@{/searchAdminProduct}" method="get">
                <input type="number" name="productid" placeholder="Product Id">
                <input type="text" name="productname" placeholder="Product Name">
                <input type="text" name="productcategory" placeholder="Category">
                <br><br>
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="search-box">
            <h3>All Products</h3>
            <form th:action="@{/searchAdminProduct}" method="get">
                <button type="submit" name="seeData" value="all">See All Products</button>
            </form>
        </div>

    </div>

    <!-- Results -->
    <div id="resultsSection" class="card">
        <h2>Search Results</h2>

        <table th:if="${products!=null && !products.isEmpty()}">
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Category</th>
                <th>Image</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>

            <tr th:each="p : ${products}">
                <td th:text="${p.productId}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.category.name}"></td>

                <td>
				    <img 
				        th:src="@{'/uploads/' + ${p.image}}" 
				        class="product-img"
				        onclick="openImage(this.src)">
				</td>

                <td th:text="${p.quantity}"></td>
                <td th:text="${p.price}"></td>

                <td>
                    <form th:action="@{/editProduct}" method="get" style="display:inline;">
					    <input type="hidden" name="productId" th:value="${p.productId}">
					    <button type="submit" class="edit-btn">Edit</button>
					</form>
                    <form th:action="@{/deleteProduct}" method="post" style="display:inline;">
					    <input type="hidden" name="productId" th:value="${p.productId}">
					    <button type="submit" class="delete-btn" onclick="return confirm('Are you sure to delete?')">
					        Delete
					    </button>
                   </form>
                </td>
            </tr>
        </table>

        <p th:if="${products==null || products.isEmpty()}">No Results Found!</p>
    </div>

    <!-- Add Product -->
    <div id="addProductSection" class="center-box">
        <div class="card add-product-card">

            <h2 style="text-align:center;">Add Product</h2>

            <form th:action="@{/addProduct}" method="post" enctype="multipart/form-data">

                <input type="text" name="productname" placeholder="Product Name">
                <input type="text" name="categoryname" placeholder="Category">

                <input type="file" name="image" onchange="previewImage(event)">
                <img id="preview" width="100">

                <input type="number" name="quantity" placeholder="Quantity">
                <input type="number" name="price" placeholder="Price">

                <div style="text-align:center;">
                    <button type="submit">Add Product</button>
                </div>

            </form>

        </div>
    </div>

</div>

</div>

<form id="logoutForm" th:action="@{/adminLogout}" method="post">
</form>

<script th:src="@{/js/common.js}"></script>		

</body>
</html>
