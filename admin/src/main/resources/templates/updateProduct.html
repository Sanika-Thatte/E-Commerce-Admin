<html xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<title>Edit Products</title>

<link rel="stylesheet" th:href="@{/css/common.css}">

</head>

<body>

<p class="message" style="color:red;" th:if="${error}" th:text="${error}"></p>
<p class="message" style="color:green;" th:if="${message}" th:text="${message}"></p>

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a th:href="@{/adminDashboard}" class="active">Home</a>
        <a th:href="@{/searchAdminProduct}">Search Products</a>
        <a th:href="@{/addProduct}">Add Product</a>

        <a href="#" sec:authorize="isAuthenticated()" onclick="confirmLogout()">Logout</a>
        <a th:href="@{/adminLogin}" sec:authorize="isAnonymous()">Login</a>
    </div>

    <!-- Main -->
    <div class="main">

        <!-- Header -->
        <div class="header">
            <h2>Welcome Admin</h2>

            <div class="logout-btn" 
                 sec:authorize="isAuthenticated()" 
                 onclick="confirmLogout()">
                Logout
            </div>

            <div class="logout-btn" 
                 sec:authorize="isAnonymous()"
                 onclick="window.location.href='/adminLogin'">
                Login
            </div>
        </div>

        <!-- Content -->
        <div class="container">

            <h2>Edit Product</h2>

            <form th:action="@{/updateProduct}" method="post" enctype="multipart/form-data">

                <input type="hidden" name="productId" th:value="${product.productId}">

                <label>Name:</label>
                <input type="text" name="name" th:value="${product.name}">

                <label>Quantity:</label>
                <input type="number" name="quantity" th:value="${product.quantity}">

                <label>Price:</label>
                <input type="number" name="price" th:value="${product.price}">

                <!-- Existing Image -->
                <label>Current Image:</label>
                <img th:src="@{'/uploads/' + ${product.image}}" width="120">

                <!-- Upload New Image -->
                <label>Change Image:</label>
                <input type="file" name="image" onchange="previewImage(event)">
                <img id="preview" width="120">

                <br>

                <button type="submit">Update Product</button>

            </form>

        </div>

    </div> <!-- ✅ main closed -->

</div> <!-- ✅ dashboard closed -->

<form id="logoutForm" th:action="@{/adminLogout}" method="post"></form>

<script th:src="@{/js/common.js}"></script>

</body>
</html>
