<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Welcome Admin</title>

	<link rel="stylesheet" th:href="@{/css/index.css}">

</head>

<body>
  
 <h1 class="header">Admin Registration</h1>

<p class="message error" th:if="${error}" th:text="${error}"></p>
<p class="message success" th:if="${message}" th:text="${message}"></p>

<p th:if="${errorMessage}" class="message error">
    <span th:text="${errorMessage}"></span>
</p>

<p th:if="${message}" class="message success">
    <span th:text="${message}"></span>
</p>

<div class="container">

    <h2 class="center-text">Already have account? Login</h2>

    <form th:action="@{/adminLogin}" method="post">
        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="username"></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" name="password"></td>
            </tr>

            <tr>
                <td></td>
                <td><button type="submit">Login</button></td>
            </tr>
        </table>
    </form>

    <br>

    <h2 class="center-text">New User? SignUp</h2>

    <form th:action="@{/adminSignUp}" method="post">
        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="username"></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" name="password"></td>
            </tr>

            <tr>
                <td></td>
                <td><button type="submit">SignUp</button></td>
            </tr>
        </table>
    </form>

</div>
  

</body>
</html>
