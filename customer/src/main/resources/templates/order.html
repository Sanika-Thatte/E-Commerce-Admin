<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>My Orders</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>

<body>

<p class="error" style="color:red;" th:if="${error}" th:text="${error}"></p>
<p class="message" style="color:green;" th:if="${message}" th:text="${message}"></p>

<div class="dashboard">

<!-- Sidebar -->
<div class="sidebar">
    <h2>Customer Panel</h2>
    <a th:href="@{/userDashboard}">Home</a>
    <a th:href="@{/searchUserProduct}">Search Products</a>
    <a th:href="@{/order}" class="active">My Orders</a>
    <a th:href="@{/cart}">Cart</a>

    <!-- Show Logout if logged in -->
		<a href="#" sec:authorize="isAuthenticated()" onclick="confirmLogout()">Logout</a>
		
		<!-- Show Login if NOT logged in -->
		<a th:href="@{/userLogin}" sec:authorize="isAnonymous()">Login</a>
</div>

<!-- Main -->
<div class="main">

<!-- Header -->
<div class="header">
    <h2>
        Welcome 
        <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
        <span sec:authorize="isAnonymous()">Customer</span>
    </h2>
</div>

<!-- Order -->
<div class="container">

<h1>My Orders</h1>

<!-- Empty -->
<p th:if="${orders == null or #lists.isEmpty(orders)}" class="empty-cart">
    No orders found!
</p>

<!-- Orders -->
<div th:if="${orders != null and !orders.isEmpty()}">

    <div class="order-card" th:each="order : ${orders}">

        <!-- Order Header -->
        <div class="order-header">
            <div>
                <b>Order ID:</b> <span th:text="${order.orderId}"></span><br>
                <b>Date:</b> <span th:text="${order.orderdate}"></span>
            </div>

            <div class="order-status"
                 th:text="${order.status}"
                 th:classappend="${order.status == 'DELIVERED'} ? 'delivered' :
                                 (${order.status == 'PENDING'} ? 'pending' : 'cancelled')">
            </div>
        </div>

        <!-- Items -->
        <div class="order-items">

            <div class="order-item" th:each="item : ${order.items}">

                <img th:src="@{'/uploads/' + ${item.product.image}}"
                     class="product-img">

                <div class="item-details">
                    <p class="item-name" th:text="${item.product.name}"></p>
                    <p>₹ <span th:text="${item.product.price}"></span></p>
                    <p>Qty: <span th:text="${item.quantity}"></span></p>
                </div>

                <div class="item-total">
                    ₹ <span th:text="${item.product.price * item.quantity}"></span>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="order-footer">
            Total: ₹ <span th:text="${order.totalAmount}"></span>
        </div>

    </div>

</div>
</div>
</div>
</div>

<form id="logoutForm" th:action="@{/userLogout}" method="post">
</form>

<script th:src="@{/js/common.js}"></script>

</body>
</html>
